<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meus Pedidos | Rosquinha do Neguin</title>
<meta name="theme-color" content="#4A2C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rosquinha">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/img/logo-circle.png">
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
    .orders-grid {
        display: grid;
        gap: 20px;
        margin-top: 30px;
    }
    .order-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: var(--shadow);
        border-left: 5px solid #ddd;
        transition: var(--transition);
    }
    .order-card.active {
        border-left-color: var(--color-dourado);
    }
    .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    .order-id {
        font-weight: 700;
        color: var(--color-chocolate);
        font-size: 1.1rem;
    }
    .order-date {
        font-size: 0.85rem;
        color: var(--color-text-sub);
    }
    .order-details {
        display: none;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #eee;
    }
    .order-details.show {
        display: block;
    }
    .item-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }
    .status-badge {
        padding: 5px 12px;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }
    .status-pendente { background: #fff3e0; color: #e65100; }
    .status-preparo { background: #e3f2fd; color: #1565c0; }
    .status-entregue { background: #e8f5e9; color: #2e7d32; }
    .status-cancelado { background: #ffebee; color: #c62828; }
    .status-confirmado { background: #efebe9; color: #4e342e; }
    .status-reembolso_solicitado { background: #fff3e0; color: #d84315; border: 1px solid #ffab91; }
    .status-reembolsado { background: #f3e5f5; color: #7b1fa2; border: 1px solid #ce93d8; }
    .status-atrasado {
        background: #ffebee;
        color: #c62828;
        border: 1px solid #ff8a80;
        font-weight: 800;
        animation: pulseAtrasado 1.8s infinite ease-in-out;
    }
    @keyframes pulseAtrasado {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(0.97); }
    }
    .delay-notice {
        background: #fff8e1;
        border-left: 4px solid #f57c00;
        padding: 10px 14px;
        border-radius: 8px;
        margin: 12px 0;
        font-size: 0.85rem;
        color: #b26a00;
    }
</style>
</head>
<body>

<!-- VLibras -->
<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
</div>

<nav role="navigation">
  <div class="nav-container">
      <a class="nav-brand" href="/">
        <img src="/img/logo-200.png" alt="Logo">
        <span>Rosquinha do Neguin</span>
      </a>
      <div class="mobile-toggle" onclick="toggleMenu()">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Início</a></li>
        <li><a href="/cardapio.html">Cardápio</a></li>
        <li><a href="/meus-pedidos.html" class="active">Meus Pedidos</a></li>
        <li><a href="/pedido.html">Carrinho <span class="cart-count">0</span></a></li>
        <li id="navAuth"><a href="/login.html" class="btn btn-outline">Entrar</a></li>
      </ul>
  </div>
</nav>

<div class="page-hero">
    <h1>Histórico de Pedidos</h1>
    <p>Acompanhe o status das suas delícias em tempo real</p>
</div>

<div class="container" style="max-width: 800px; padding: 60px 20px;">
    <div id="ordersList" class="orders-grid">
        <div class="text-center" style="padding: 40px;">
            <p>Carregando seus pedidos...</p>
        </div>
    </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/shared.js"></script>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

<script>
    async function loadOrders() {
        const container = document.getElementById('ordersList');
        try {
            // Busca dados da loja (tempo de preparo estimado)
            let tempoPreparoMinutos = 45;
            try {
                const config = await apiFetch('/api/config/public');
                if (config && config.tempoPreparoMinutos) {
                    tempoPreparoMinutos = config.tempoPreparoMinutos;
                }
            } catch (e) {
                console.warn('Não foi possível carregar config pública:', e);
            }

            const orders = await apiFetch('/api/pedidos/my');
            
            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="form-card text-center" style="padding: 60px;">
                        <div style="font-size: 4rem; margin-bottom: 20px;">📦</div>
                        <h3>Você ainda não fez nenhum pedido.</h3>
                        <p style="margin-bottom: 25px;">Que tal explorar nosso cardápio e fazer sua primeira escolha?</p>
                        <a href="/cardapio.html" class="btn btn-gold">Ver Cardápio</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => {
                const isActive = ['pendente', 'preparo', 'confirmado', 'reembolso_solicitado'].includes(order.status);
                const elapsedMin = Math.floor((new Date() - new Date(order.criadoEm)) / 60000);
                const isDelayed = (order.status !== 'entregue' && order.status !== 'cancelado' && order.status !== 'reembolsado') && (elapsedMin > tempoPreparoMinutos);

                let statusBadgeText = order.status;
                if (order.status === 'reembolso_solicitado') statusBadgeText = 'Reembolso Solicitado';
                if (order.status === 'reembolsado') statusBadgeText = 'Reembolsado';

                let delayBadge = '';
                let delayBanner = '';

                if (order.status === 'reembolso_solicitado') {
                    delayBanner = `
                        <div class="delay-notice" style="background:#fff3e0; border-left:4px solid #e65100; color:#bf360c;">
                            🔔 <strong>Reembolso em Análise:</strong> Você solicitou o cancelamento e reembolso deste pedido por atraso. A loja está processando sua solicitação.
                        </div>`;
                } else if (order.status === 'reembolsado') {
                    delayBanner = `
                        <div class="delay-notice" style="background:#f3e5f5; border-left:4px solid #7b1fa2; color:#4a148c;">
                            ✅ <strong>Reembolso Aprovado:</strong> O pedido foi cancelado e o reembolso foi aprovado pela loja.
                        </div>`;
                } else if (isDelayed) {
                    delayBadge = `<span class="status-badge status-atrasado" style="margin-left: 6px;">⚠️ Atrasado (+${elapsedMin - tempoPreparoMinutos} min)</span>`;
                    delayBanner = `
                        <div class="delay-notice" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                            <div>
                                ⏱️ <strong>Tempo estendido:</strong> Este pedido ultrapassou a estimativa inicial de ${tempoPreparoMinutos} min.
                            </div>
                            <button class="btn btn-sm" style="background: #d32f2f; color: white; border: none; font-size: 0.8rem; padding: 6px 14px; border-radius: 6px; cursor: pointer;" onclick="solicitarReembolso(${order.id})">
                                💸 Solicitar Reembolso
                            </button>
                        </div>`;
                }

                return `
                    <div class="order-card ${isActive ? 'active' : ''}">
                        <div class="order-header">
                            <div>
                                <div class="order-id">Pedido #${order.id}</div>
                                <div class="order-date">${new Date(order.criadoEm).toLocaleString()}</div>
                            </div>
                            <div>
                                <span class="status-badge status-${order.status}">${statusBadgeText}</span>
                                ${delayBadge}
                            </div>
                        </div>

                        ${delayBanner}

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <div style="font-weight: 700; font-size: 1.2rem; color: var(--color-chocolate);">
                                Total: ${formatBRL(order.total)}
                            </div>
                            <button class="btn btn-outline btn-sm" onclick="toggleDetails(${order.id})">
                                Ver Detalhes
                            </button>
                        </div>
                        
                        <div id="details-${order.id}" class="order-details">
                            <h4 style="margin-bottom: 10px;">Itens do Pedido:</h4>
                            ${(order.itens || []).map(item => `
                                <div class="item-row">
                                    <span>${item.quantidade}x ${item.emojiProduto} ${item.nomeProduto}</span>
                                    <span>${formatBRL(item.precoUnitario * item.quantidade)}</span>
                                </div>
                            `).join('')}
                            
                            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #f9f9f9; display: flex; gap: 10px;">
                                <button class="btn btn-gold btn-sm" style="background: #25D366; border: none;" onclick="contactSupport(${order.id})">
                                    Dúvidas? WhatsApp 💬
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

        } catch (err) {
            console.error(err);
            if (err.message.includes('401') || err.message.includes('Unauthorized')) {
                container.innerHTML = `<p class="text-danger text-center">Sua sessão expirou. Por favor, <a href="/login.html">faça login novamente</a>.</p>`;
            } else {
                container.innerHTML = `
                    <div class="text-center">
                        <p class="text-danger">Não foi possível carregar seus pedidos no momento.</p>
                        <p style="font-size: 0.8rem; color: #999;">Detalhe: ${err.message}</p>
                        <button onclick="loadOrders()" class="btn btn-outline btn-sm" style="margin-top: 10px;">Tentar Novamente</button>
                    </div>
                `;
            }
        }
    }

    async function solicitarReembolso(id) {
        const motivo = prompt('Por favor, confirme o motivo da solicitação de reembolso:', 'Atraso no tempo estimado de preparo/entrega');
        if (motivo === null) return; // Cancelou

        try {
            const res = await apiFetch(`/api/pedidos/${id}/solicitar-reembolso`, {
                method: 'POST',
                body: JSON.stringify({ motivo })
            });
            showToast(res.mensagem || 'Solicitação de reembolso enviada com sucesso!', 'success');
            loadOrders();
        } catch (err) {
            showToast(err.message || 'Erro ao solicitar reembolso', 'danger');
        }
    }

    function toggleDetails(id) {
        document.getElementById(`details-${id}`).classList.toggle('show');
    }

    function contactSupport(id) {
        const msg = `Olá! Tenho uma dúvida sobre o meu pedido #${id}.`;
        window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
        const user = localStorage.getItem('user');
        if (!user) {
            window.location.href = '/login.html?redirect=/meus-pedidos.html';
            return;
        }
        loadOrders();
    });
</script>

</body>
</html>
