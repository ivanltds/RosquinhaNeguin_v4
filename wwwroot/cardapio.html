<head>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
</head>
<body>

<!-- VLibras -->
<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
</div>

<nav role="navigation">
  <div class="nav-container">
      <a class="nav-brand" href="/">
        <img src="/img/logo-200.png" alt="Logo">
        <span>Rosquinha do Neguin</span>
      </a>
      
      <div class="mobile-toggle" onclick="toggleMenu()">☰</div>
      
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Início</a></li>
        <li><a href="/cardapio.html" class="active">Cardápio</a></li>
        <li class="user-only" style="display: none;"><a href="/meus-pedidos.html">Meus Pedidos</a></li>
        <li><a href="/pedido.html">Carrinho <span class="cart-count">0</span></a></li>
        <li id="navAuth">
            <a href="/login.html" class="btn btn-outline">Entrar</a>
        </li>
      </ul>
  </div>
</nav>

<div class="page-hero">
  <h1>Nosso Cardápio</h1>
  <p>Feito com carinho para você</p>
</div>

<!-- Container do Cardápio -->
<div class="container">
    
    <!-- Filtros (Abas) -->
    <div class="cardapio-nav">
        <div class="tabs">
            <button class="tab-btn active" onclick="filtrar('churros', this)">🍩 Churros</button>
            <button class="tab-btn" onclick="filtrar('rosquinhas', this)">🥯 Rosquinhas</button>
            <button class="tab-btn" onclick="filtrar('salgados', this)">🍗 Salgados</button>
            <button class="tab-btn" onclick="filtrar('bebidas', this)">☕ Bebidas</button>
            <button class="tab-btn" onclick="filtrar('combos', this)">🎁 Combos</button>
        </div>
    </div>

    <!-- Status de Carregamento -->
    <div id="statusMsg" style="text-align: center; margin-bottom: 30px; font-weight: 500; color: var(--color-chocolate); letter-spacing: 0.5px;"></div>

    <!-- Grid de Produtos -->
    <div id="mainGrid" class="product-grid">
        <!-- Itens serão injetados aqui -->
    </div>

</div>

<footer>
  <div class="container">
    <img src="/img/logo-200.png" alt="Logo" style="height: 60px; margin-bottom: 20px;">
    <p>© 2026 Rosquinha do Neguin - Todos os direitos reservados</p>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/shared.js"></script>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

<script>
// Cache de produtos para evitar requisições repetidas
const cache = {};

function renderCard(p) {
    return `
    <div class="product-card">
      <div class="product-emoji">${p.emoji}</div>
      <div class="product-info">
        <div class="product-name">${p.nome}</div>
        <div class="product-desc">${p.descricao || ''}</div>
      </div>
      <div class="product-footer">
        <div class="product-price">${formatBRL(p.preco)}</div>
        <button class="btn btn-gold btn-sm" onclick="addItem(${p.id}, '${p.nome}', ${p.preco}, '${p.emoji}')">
          Adicionar
        </button>
      </div>
    </div>`;
}

async function filtrar(cat, btn) {
    // 1. Estética dos botões
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const grid = document.getElementById('mainGrid');
    const status = document.getElementById('statusMsg');

    // 2. Verifica Cache ou Busca API
    if (cache[cat]) {
        grid.innerHTML = cache[cat].map(renderCard).join('');
        status.textContent = `Exibindo ${cache[cat].length} itens em ${cat}.`;
        return;
    }

    grid.innerHTML = '';
    status.textContent = `Carregando ${cat}...`;

    try {
        const data = await apiFetch('/api/produtos?categoria=' + cat);
        console.log('Dados recebidos:', data);
        
        if (data && data.length > 0) {
            cache[cat] = data;
            grid.innerHTML = data.map(renderCard).join('');
            status.textContent = `Encontrados ${data.length} itens em ${cat}.`;
        } else {
            grid.innerHTML = '';
            status.textContent = `Nenhum produto encontrado na categoria "${cat}".`;
        }
    } catch (err) {
        console.error(err);
        status.innerHTML = `<span style="color: red; font-weight: bold;">Erro ao carregar: ${err.message}</span>`;
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Por favor, tente novamente ou verifique sua conexão.</p>';
    }
}

// Inicialização
document.addEventListener('DOMContentLoaded', () => {
    updateCartBadge();
    // Inicia com churros
    const defaultBtn = document.querySelector('.tabs button');
    if (defaultBtn) filtrar('churros', defaultBtn);
});
</script>

</body>
</html>
