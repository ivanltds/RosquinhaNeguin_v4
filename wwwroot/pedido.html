<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Título da página -->
<title>Meu Pedido | Rosquinha do Neguin</title>

<!-- Ícone -->
<link rel="icon" href="/favicon.ico">

<!-- Fontes externas -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<!-- CSS global -->
<link rel="stylesheet" href="/css/shared.css">

</head>

<body>

<!-- NAV -->
<nav>
  <!-- logo -->
  <a class="nav-brand" href="/">
    <img src="/img/logo-200.png">
    <span>Rosquinha do Neguin</span>
  </a>
</nav>

<!-- HERO -->
<div class="page-hero">
  <h1>Meu Pedido</h1>
</div>

<!-- LAYOUT -->
<div class="pedido-layout container" style="max-width: 1000px; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: 1fr 350px; gap: 40px;">

  <!-- LISTA DE ITENS -->
  <div id="cartItems" class="form-card">
    <h2 style="margin-bottom: 20px; color: var(--color-chocolate);">Seus Produtos</h2>
    <div id="cartContent">
        <!-- Preenchido via JS -->
    </div>
  </div>

  <!-- FORMULÁRIO E FINALIZAÇÃO -->
  <div class="form-card" style="height: fit-content;">
    <h2 style="margin-bottom: 20px; color: var(--color-chocolate);">Finalizar</h2>
    
    <div class="form-group">
      <label>Seu Nome</label>
      <input type="text" id="nomeCliente" class="form-control" placeholder="Como te chamamos?">
    </div>

    <div class="form-group">
      <label>Forma de Pagamento</label>
      <select id="formaPagamento" class="form-control">
        <option value="Pix">Pix</option>
        <option value="Cartão">Cartão</option>
        <option value="Dinheiro">Dinheiro</option>
      </select>
    </div>

    <div id="totalPedido" style="margin: 20px 0; padding-top: 20px; border-top: 1px solid #eee; font-size: 1.5rem; font-weight: 800; text-align: right; color: var(--color-chocolate);">
        Total: R$ 0,00
    </div>

    <button onclick="finalizarPedido()" id="btnFinalizar" class="btn btn-gold" style="width: 100%; font-size: 1.2rem;">
      Fazer Pedido 🚀
    </button>
  </div>

</div>

<!-- JS CONFIG (URL da API) -->
<script src="/js/config.js"></script>

<!-- JS GLOBAL -->
<script src="/js/shared.js"></script>

<script>

/* renderiza carrinho */
function renderCart() {
  const cart = getCart();
  const items = Object.values(cart);
  const container = document.getElementById('cartContent');
  
  if (items.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 40px;">
        <div style="font-size: 4rem; margin-bottom: 20px;">🛒</div>
        <p>Seu carrinho está vazio.</p>
        <a href="/cardapio.html" class="btn btn-outline" style="margin-top:20px;">Voltar ao Cardápio</a>
    </div>`;
    document.getElementById('totalPedido').textContent = 'Total: R$ 0,00';
    return;
  }

  container.innerHTML = items.map(item => `
    <div style="display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid #eee;">
      <div style="font-size: 2rem;">${item.emoji}</div>
      <div style="flex-grow: 1;">
        <div style="font-weight: 700; color: var(--color-chocolate);">${item.nome}</div>
        <div style="font-size: 0.9rem; color: var(--color-text-sub);">${formatBRL(item.preco)} cada</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <button onclick="changeQty(${item.id}, -1)" class="btn btn-outline" style="padding: 5px 12px;">-</button>
        <span style="font-weight: 800; min-width: 25px; text-align: center;">${item.qty}</span>
        <button onclick="changeQty(${item.id}, 1)" class="btn btn-outline" style="padding: 5px 12px;">+</button>
      </div>
      <div style="font-weight: 700; min-width: 80px; text-align: right;">
        ${formatBRL(item.preco * item.qty)}
      </div>
    </div>
  `).join('');

  document.getElementById('totalPedido').textContent = 'Total: ' + formatBRL(cartTotal());
}

/* altera quantidade */
function changeQty(id, delta) {
  const cart = getCart();
  const key = String(id);
  
  if (cart[key]) {
    cart[key].qty += delta;
    if (cart[key].qty <= 0) delete cart[key];
    saveCart(cart);
    renderCart();
  }
}

/* FINALIZAR PEDIDO */
async function finalizarPedido() {
  const items = Object.values(getCart());
  const nome = document.getElementById('nomeCliente').value.trim();
  const pagamento = document.getElementById('formaPagamento').value;

  if (!items.length) {
    showToast('Adicione itens ao carrinho primeiro!', 'error');
    return;
  }

  if (!nome) {
    showToast('Por favor, informe seu nome.', 'error');
    document.getElementById('nomeCliente').focus();
    return;
  }

  const btn = document.getElementById('btnFinalizar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    // 1. Enviar para a API (Backend)
    const pedidoApi = {
        nomeCliente: nome,
        observacao: `Pagamento: ${pagamento}`,
        itens: items.map(i => ({ produtoId: i.id, quantidade: i.qty }))
    };

    const res = await apiFetch('/api/pedidos', {
      method: 'POST',
      body: JSON.stringify(pedidoApi)
    });

    showToast('Pedido realizado com sucesso!', 'success');

    // 2. Montar mensagem para o WhatsApp
    let msg = `*Novo Pedido - ${CONFIG.nomeLoja}*\n`;
    msg += `-------------------------------\n`;
    msg += `👤 *Cliente:* ${nome}\n`;
    msg += `💳 *Pagamento:* ${pagamento}\n`;
    msg += `-------------------------------\n`;
    
    items.forEach(i => {
      msg += `${i.qty}x ${i.emoji} ${i.nome} - ${formatBRL(i.preco * i.qty)}\n`;
    });

    msg += `-------------------------------\n`;
    msg += `💰 *TOTAL: ${formatBRL(cartTotal())}*\n\n`;
    msg += `_Pedido gerado via Site_`;

    // Limpar carrinho e redirecionar
    clearCart();

    setTimeout(() => {
      window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`);
      window.location.href = '/index.html';
    }, 1000);

  } catch (e) {
    console.error(e);
    showToast('Erro ao salvar pedido: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Fazer Pedido 🚀';
  }
}

/* inicialização */
renderCart();
</script>

</body>
</html>
